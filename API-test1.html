<body>

  <script>
     async function obtenrDatos(){
    const API_URL = `https://api.restcountries.com/countries/v5?q=canada`
    
    try {
      const respuesta = await fetch(API_URL, {
      headers: { 'Authorization': 'Bearer rc_live_1d1d021cc5164e49a9781ce11a4e5761' }
      })

      if(!respuesta.ok){
        throw new Error(`No es posible conectarse al servidor`)
      }
      
      const datos = await respuesta.json()
      console.log(datos)
    }catch(e){
      console.error(`No se pudo concretar la operación: ${e}`)
    }


  }

    obtenrDatos()
  </script>
  
</body>
